name: BJMFSign
options:
  bundleIdPrefix: com.bjmf.sign
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"

targets:
  BJMFSign:
    type: application
    platform: iOS
    sources:
      - path: BJMFSign
      - path: Shared
    dependencies:
      - package: SwiftSoup
      - target: BJMFSignWidget
    entitlements:
      path: BJMFSign/Resources/BJMFSign.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bjmf.sign.ios
    info:
      path: BJMFSign/Resources/Info.plist
      properties:
        CFBundleDisplayName: 班级魔方签到
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: 用于获取当前位置并收藏为签到点
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.bjmf.sign.ios.refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjmf.sign.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BJMFSignWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BJMFSignWidget
      - path: Shared
    entitlements:
      path: BJMFSignWidget/BJMFSignWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bjmf.sign.ios
    info:
      path: BJMFSignWidget/Info.plist
      properties:
        CFBundleDisplayName: 班级魔方签到
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjmf.sign.ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  BJMFSign:
    build:
      targets:
        BJMFSign: all
    run:
      config: Debug
    archive:
      config: Release
