name: Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate temporary keystore
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android -alias bjmf \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BJMFSign"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=android"
            echo "RELEASE_KEY_ALIAS=bjmf"
            echo "RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BJMFSign-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
